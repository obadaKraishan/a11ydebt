[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "a11ydebt"
version = "0.1.0.dev0"
description = "Audit accessibility debt (missing content descriptions) in the GUI corpora that train computer-use agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Obada Kraishan" }]
keywords = ["accessibility", "gui-agents", "rico", "androidcontrol", "content-description", "dataset-audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
]

[project.scripts]
a11ydebt = "a11ydebt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/a11ydebt"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pyarrow>=25.0.1",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]
