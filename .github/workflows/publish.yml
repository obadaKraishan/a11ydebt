name: Publish to PyPI

# Runs when a GitHub release is published. The upload uses PyPI trusted publishing (OIDC), so no
# token or secret is stored anywhere. The `pypi` environment requires the maintainer's approval
# before the upload job starts. Every action is pinned to a full commit SHA; the comment gives the
# exact version.

on:
  release:
    types: [published]

permissions:
  contents: read

# One publish at a time; never cancel an upload that has started.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build the sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build
        run: uv build

      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          ls -l dist
          test -f "dist/a11ydebt-${version}.tar.gz"
          test -f "dist/a11ydebt-${version}-py3-none-any.whl"
          test "$(ls dist | wc -l)" -eq 2

      - name: Store the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/a11ydebt/
    permissions:
      id-token: write # the OIDC token that PyPI trusted publishing exchanges for a short-lived upload token
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Upload with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
